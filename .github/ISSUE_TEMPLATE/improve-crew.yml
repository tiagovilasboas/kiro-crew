name: Improve Kiro adapter
description: Propose a change to the Kiro paste pack, steering/hooks constraints, board, or fixture.
title: "[kiro] "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Use this form to improve the Kiro host adapter. Write in English.
        Pattern theory belongs in jarvis-architecture. Desktop CoS belongs in grok-bot-architecture.
        See [CONTRIBUTING.md](https://github.com/tiagovilasboas/kiro-crew/blob/main/CONTRIBUTING.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which adapter surface should change?
      options:
        - paste-into-kiro
        - steering-or-hooks
        - board
        - fixture
        - other
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Gap
      description: What Kiro-specific step or field is missing or skippable?
      placeholder: Custom agents drop steering unless resources is set; the paste page did not say so.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Smallest edit that closes the gap. Prefer one constraint or fixture field over a new role.
      placeholder: Add the resources glob note to docs/paste-into-kiro.md and pack/steering/hitl.md.
    validations:
      required: true
  - type: textarea
    id: pattern
    attributes:
      label: Kiro or sibling reference (optional)
      description: Link a Kiro docs page or a jarvis ADR. Do not paste vendor APIs for other hosts.
      placeholder: https://kiro.dev/docs/steering/ (custom agents need resources)
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is Kiro-delta (not a restated jarvis / grok-bot manifesto).
          required: true
        - label: HITL stays fail-closed if the change touches gates or the fixture.
          required: false
